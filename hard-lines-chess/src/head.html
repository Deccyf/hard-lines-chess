<title>Hard Lines Chess</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chess">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* ── the design system ────────────────────────────────────────────────
     Quiet surfaces, one accent, hairline rules, soft corners. The board is the
     loudest thing on any screen and everything else is built to sit behind it.
     Text is a sans-serif; monospace is reserved for notation, where fixed-width
     glyphs actually earn their place. */
  :root {
    color-scheme: light;
    --page: #f4f5f7;
    --panel: #ffffff;
    --sunk: #f0f2f5;
    --line: #e3e6eb;
    --line-strong: #c9ced6;
    --ink: #16191f;
    --ink-soft: #464c57;
    --ink-faint: #6b7280;
    --accent: #1f5eab;
    --accent-deep: #174a89;
    --accent-tint: #e9f0fb;
    --on-accent: #ffffff;
    --good: #1b8a4c;
    --good-tint: #e6f4ec;
    --warn: #b7791f;
    --danger: #c93b2f;
    --danger-tint: #fbe9e7;
    --mark: #f2d15c;
    /* The board keeps its daylight colours at night: a board is a board, and
       every serious chess product leaves it alone when the interface darkens. */
    --board-light: #eeeed2;
    --board-dark: #769656;
    --threat: #2469c8;
    --arrow-halo: #ffffff;
    /* A PIECE'S COLOURS DO NOT FOLLOW THE THEME. A white piece needs a dark
       edge and a dark piece a light one on every square of every theme, so
       both pairs are fixed. */
    --piece-light: #fbfaf7;
    --piece-dark: #1b1f27;
    --piece-edge-on-light: #1b1f27;
    --piece-edge-on-dark: #fbfaf7;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 6px rgba(16, 24, 40, .06);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: var(--sans);
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e1116; --panel: #161a20; --sunk: #1d222a;
      --line: #262c36; --line-strong: #384050;
      --ink: #e7e9ec; --ink-soft: #b6bcc6; --ink-faint: #8b929d;
      --accent: #6f9ff0; --accent-deep: #5a8ae0; --accent-tint: #1c2a42; --on-accent: #0e1116;
      --good: #48c37f; --good-tint: #163224; --warn: #d9a441;
      --danger: #e2574a; --danger-tint: #3a1f1c; --mark: #d9b93f;
      --threat: #5aa0ff; --arrow-halo: #0e1116;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-sm: 0 1px 1px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e1116; --panel: #161a20; --sunk: #1d222a;
    --line: #262c36; --line-strong: #384050;
    --ink: #e7e9ec; --ink-soft: #b6bcc6; --ink-faint: #8b929d;
    --accent: #6f9ff0; --accent-deep: #5a8ae0; --accent-tint: #1c2a42; --on-accent: #0e1116;
    --good: #48c37f; --good-tint: #163224; --warn: #d9a441;
    --danger: #e2574a; --danger-tint: #3a1f1c; --mark: #d9b93f;
    --threat: #5aa0ff; --arrow-halo: #0e1116;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-sm: 0 1px 1px rgba(0, 0, 0, .25);
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-xs); }
  a { color: var(--accent); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 16px 16px 64px; }

  /* ── header and navigation ───────────────────────────────────────────
     One nav element serves both layouts. On a wide screen it is a row of text
     tabs under the brand; on a phone the same buttons become a bar fixed to the
     bottom of the screen with an icon over each label, which is where a thumb
     already is. The second level is a segmented control at the top of the
     content in both. */
  header { display: grid; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    display: grid; grid-template-columns: 1fr 1fr; width: 28px; height: 28px; flex: none;
    border-radius: 7px; overflow: hidden; border: 1px solid var(--line-strong);
  }
  .mark i { display: block; }
  .mark i:nth-child(1), .mark i:nth-child(4) { background: var(--board-light); }
  .mark i:nth-child(2), .mark i:nth-child(3) { background: var(--board-dark); }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .sub { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); max-width: 62ch; }

  .tabs-wrap { position: relative; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    background: transparent; color: var(--ink-soft);
    padding: 8px 12px 10px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab svg { width: 20px; height: 20px; flex: none; }
  .tab-label { white-space: nowrap; }

  /* The second level: a segmented control. Quieter than the first, because it
     is where you are inside a place you have already chosen. */
  .subtabs-wrap { margin-top: 2px; }
  .tabs.subtabs {
    border-bottom: 0; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px;
    width: max-content; max-width: 100%;
  }
  /* A sub-tab is a flex container (it is a .tab), so its label is placed by
     justify-content, not text-align — without this the label sat at the left
     of whatever width the tab was given, and "Drills" was off-centre on a
     phone while "Endgames", sized exactly to its text, looked fine. */
  .subtab {
    border: 0; margin: 0; border-radius: 8px; padding: 6px 12px; justify-content: center;
    font-size: 13px; font-weight: 500; color: var(--ink-soft);
  }
  .subtab.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm); border-bottom: 0; font-weight: 600; }

  /* The fade that says "more to the right" — only drawn while there is. */
  .tabs-wrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 22px;
    background: linear-gradient(to right, transparent, var(--page) 85%);
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  .tabs { scroll-padding-inline: 28px; }
  .tabs-wrap.more::after { opacity: 1; }

  @media (max-width: 859px) {
    .wrap { padding-bottom: calc(var(--nav-h) + 24px); }
    #tabsWrap {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: color-mix(in srgb, var(--panel) 97%, transparent);
      -webkit-backdrop-filter: saturate(160%) blur(12px); backdrop-filter: saturate(160%) blur(12px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #tabsWrap::after { display: none; }
    #tabsWrap .tabs { border-bottom: 0; gap: 0; height: var(--nav-h); overflow: visible; }
    #tabsWrap .tab {
      flex: 1 1 0; flex-direction: column; justify-content: center; gap: 3px;
      padding: 6px 2px; margin: 0; border-bottom: 0; font-size: 11px; font-weight: 500; min-width: 0;
      color: var(--ink-faint); border-radius: 0;
    }
    #tabsWrap .tab svg { width: 22px; height: 22px; }
    #tabsWrap .tab.on { color: var(--accent); }
    .tabs.subtabs { width: 100%; }
    /* Each tab is its own width plus an equal share of the slack, so five
       labels of different lengths sit with even gaps between them rather than
       equal boxes with the text bunched to one side. */
    .subtab { flex: 1 1 auto; padding: 6px 4px; font-size: 12px; white-space: nowrap; }
  }
  @media (min-width: 860px) {
    .tab svg { display: none; }
  }

  .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr) 21rem; align-items: start; } }

  /* ── the board ────────────────────────────────────────────────────────
     `container-type: inline-size` makes the board's own width available to
     the pieces as cqw, so a glyph is a fraction of a square. `position:
     relative` is what the arrow overlay measures itself against. */
  .board-frame {
    position: relative; border-radius: var(--radius-sm); overflow: hidden;
    box-shadow: 0 0 0 1px var(--line-strong), var(--shadow);
    width: 100%; max-width: 520px; container-type: inline-size;
  }
  /* BOTH axes declared: rows left to auto size to the tallest glyph and every
     square came out 44 wide by 63 tall. */
  .board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1; width: 100%; touch-action: manipulation; user-select: none;
  }
  .sq {
    position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer;
    /* NOT overflow:hidden — that clipped a sliding piece for most of its journey. */
    min-width: 0; min-height: 0;
  }
  .sq:has(.sliding) { z-index: 3; }
  .sq.light { background: var(--board-light); }
  .sq.dark { background: var(--board-dark); }
  .piece {
    font-size: min(9.5vw, 46px); font-size: 9.2cqw;
    line-height: 1; pointer-events: none; position: relative; z-index: 1;
  }
  .piece.sliding { transition: transform 190ms cubic-bezier(0.22, 0.61, 0.36, 1); }
  @media (prefers-reduced-motion: reduce) { .piece.sliding { transition: none; } }
  :root[data-animate="off"] .piece.sliding { transition: none; }
  .promo .piece { font-size: 30px; position: static; pointer-events: auto; }

  .arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .arrow { stroke-linecap: round; fill: none; }
  .arrow-halo { stroke: var(--arrow-halo); stroke-dasharray: none; }
  .arrow-halo-head { fill: var(--arrow-halo); stroke: var(--arrow-halo); stroke-linejoin: round; }
  /* ONE MEANING EVERYWHERE: red dashed is what you played, green is what the
     engine wanted, blue is a move played at you. The dash carries "yours"
     without needing colour. */
  .arrow-played { stroke: var(--danger); stroke-dasharray: 0.3 0.17; }
  .arrow-played.arrow-head { fill: var(--danger); stroke: none; }
  .arrow-best { stroke: var(--good); }
  .arrow-best.arrow-head { fill: var(--good); stroke: none; }
  .arrow-threat { stroke: var(--threat); }
  .arrow-threat.arrow-head { fill: var(--threat); stroke: none; }
  .arrow-user { stroke: #f0a020; }
  .arrow-user.arrow-head { fill: #f0a020; stroke: none; }
  .arrow, .arrow-head { paint-order: stroke fill; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 3px; display: inline-block; border-radius: 2px; }
  .legend .k-played { background: repeating-linear-gradient(to right, var(--danger) 0 5px, transparent 5px 8px); }
  .legend .k-best { background: var(--good); }
  .legend .k-threat { background: var(--threat); }
  .legend .k-user { background: #f0a020; }

  .piece.w {
    color: var(--piece-light);
    text-shadow:
      1px 1px 0 var(--piece-edge-on-light), -1px -1px 0 var(--piece-edge-on-light),
      1px -1px 0 var(--piece-edge-on-light), -1px 1px 0 var(--piece-edge-on-light),
      0 1px 0 var(--piece-edge-on-light), 0 -1px 0 var(--piece-edge-on-light),
      1px 0 0 var(--piece-edge-on-light), -1px 0 0 var(--piece-edge-on-light);
  }
  .piece.b {
    color: var(--piece-dark);
    text-shadow:
      1px 1px 0 var(--piece-edge-on-dark), -1px -1px 0 var(--piece-edge-on-dark),
      1px -1px 0 var(--piece-edge-on-dark), -1px 1px 0 var(--piece-edge-on-dark),
      0 1px 0 var(--piece-edge-on-dark), 0 -1px 0 var(--piece-edge-on-dark),
      1px 0 0 var(--piece-edge-on-dark), -1px 0 0 var(--piece-edge-on-dark);
  }
  /* EVERY MARK IS DRAWN FROM A THEME-INDEPENDENT SOURCE, so it reads on both
     squares of every board. */
  .sq.sel::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--mark); box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); z-index: 2; pointer-events: none; }
  .sq.last { box-shadow: inset 0 0 0 100vmax color-mix(in srgb, var(--mark) 55%, transparent); }
  .sq.check::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    border: 4px solid #c93b2f; box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 1px #ffffff;
  }
  .sq.mark::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--good); box-shadow: inset 0 0 0 1px #ffffff; z-index: 2; pointer-events: none; }
  .dot {
    position: absolute; width: 28%; height: 28%; border-radius: 50%; pointer-events: none; z-index: 2;
    background: rgba(20,20,20,.45); box-shadow: 0 0 0 2px rgba(255,255,255,.6);
  }
  .sq.cap .dot { width: 84%; height: 84%; background: transparent; border: 4px solid rgba(20,20,20,.45); box-shadow: 0 0 0 2px rgba(255,255,255,.6), inset 0 0 0 2px rgba(255,255,255,.6); }
  .sq.hl-1 { box-shadow: inset 0 0 0 5px #c93b2f, inset 0 0 0 7px #ffffff, inset 0 0 0 100vmax color-mix(in srgb, #c93b2f 40%, transparent); }
  .sq.hl-2 { box-shadow: inset 0 0 0 5px #1b8a4c, inset 0 0 0 7px #ffffff, inset 0 0 0 100vmax color-mix(in srgb, #1b8a4c 40%, transparent); }
  .sq.hl-3 { box-shadow: inset 0 0 0 5px #2469c8, inset 0 0 0 7px #ffffff, inset 0 0 0 100vmax color-mix(in srgb, #2469c8 40%, transparent); }
  .sq.hl-4 { box-shadow: inset 0 0 0 5px #f2d15c, inset 0 0 0 7px #1b1f27, inset 0 0 0 100vmax color-mix(in srgb, #f2d15c 45%, transparent); }
  .sq.hang::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    border: 4px dashed #1b1f27; box-shadow: inset 0 0 0 2px #ffffff, 0 0 0 1px #ffffff;
  }
  .coords { display: grid; grid-template-columns: repeat(8, 1fr); max-width: 520px; padding: 4px 0 0; font-size: 11px; color: var(--ink-faint); }
  .coords span { text-align: center; }
  :root[data-coords="off"] .coords { visibility: hidden; }

  /* ── board themes ───────────────────────────────────────────────────── */
  :root[data-board="green"]     { --board-light: #eeeed2; --board-dark: #769656; }
  :root[data-board="walnut"]    { --board-light: #f0d9b5; --board-dark: #b58863; }
  :root[data-board="slate"]     { --board-light: #dee3e6; --board-dark: #8ca2ad; }
  :root[data-board="ink"]       { --board-light: #e7e2d5; --board-dark: #4d463c; }
  :root[data-board="sand"]      { --board-light: #f5f0dc; --board-dark: #c9a86a; }
  :root[data-board="vermilion"] { --board-light: #ffffff; --board-dark: #e8412a; }

  /* ── piece styles ───────────────────────────────────────────────────── */
  :root[data-pieces="classic"] .piece.w,
  :root[data-pieces="classic"] .piece.b {
    color: var(--piece-dark); -webkit-text-stroke: 0.045em var(--piece-dark); paint-order: stroke fill;
    text-shadow: 0 0 2px var(--piece-edge-on-dark), 0 0 2px var(--piece-edge-on-dark), 0 0 1px var(--piece-edge-on-dark);
  }
  :root[data-pieces="letters"] .piece {
    font-family: var(--sans); font-weight: 700; font-size: 5.6cqw; width: 66%; height: 66%;
    display: flex; align-items: center; justify-content: center; border-radius: 6px;
    text-shadow: none; border: 1.5px solid #1b1f27; box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  :root[data-pieces="letters"] .piece.w { background: #fbfaf7; color: #1b1f27; }
  :root[data-pieces="letters"] .piece.b { background: #1b1f27; color: #fbfaf7; border-color: #fbfaf7; }
  :root[data-pieces="letters"] .promo .piece { font-size: 20px; width: 44px; height: 44px; }

  /* ── surfaces ─────────────────────────────────────────────────────── */
  .panel {
    border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }
  /* Vertical rhythm for blocks that declare no margin of their own. A type
     selector loses to any class, so .note, .lede and .row keep theirs. */
  section > * + *, section > div > * + *, .layout > div > * + * { margin-top: 14px; }
  .panel + .panel { margin-top: 14px; }
  .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.005em; }
  h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 10px; }
  h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  h4 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin: 12px 0 6px; font-weight: 600; }
  .lede { color: var(--ink-soft); max-width: 62ch; margin: 0 0 14px; font-size: 14px; }
  section { animation: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
    padding: 9px 14px; font-size: 13.5px; font-weight: 500; line-height: 1.2; border-radius: var(--radius-sm);
    cursor: pointer; box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s, transform .06s;
  }
  .btn:hover { background: var(--sunk); border-color: var(--line-strong); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn.danger { background: var(--danger); color: #ffffff; border-color: var(--danger); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .rungs { display: grid; gap: 8px; }
  .rung { display: flex; gap: 10px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; text-align: left; }
  .rung.on { background: var(--accent-tint); border-color: var(--accent); }
  .rung input { margin: 3px 0 0; accent-color: var(--accent); flex: none; }
  .rung b { display: block; font-size: 13.5px; font-weight: 600; }
  .rung span { display: block; font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; }

  .status { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13.5px; }
  .status.over { background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .status.teach { border-left: 4px solid var(--mark); }
  .status b { display: block; font-size: 15px; font-weight: 600; }

  .moves { max-height: 220px; overflow-y: auto; font-size: 13.5px; }
  .moves ol { margin: 0; padding: 0; list-style: none; }
  .moves li { display: grid; grid-template-columns: 2.4rem 1fr 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; }
  .moves li:last-child { border-bottom: 0; }
  .moves li.empty { display: block; font-family: var(--sans); color: var(--ink-faint); }
  .moves .n { color: var(--ink-faint); }

  .readout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12.5px; }
  .readout div { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--radius-sm); padding: 10px 12px; }
  .readout .k { display: block; font-size: 12px; color: var(--ink-faint); font-weight: 500; margin-bottom: 2px; }
  .readout .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

  .note { font-size: 13px; color: var(--ink-faint); line-height: 1.5; margin: 10px 0 0; }
  .note strong { color: var(--ink-soft); font-weight: 600; }
  .good-note { color: var(--good); }
  .bad-note { color: var(--danger); }
  .empty { color: var(--ink-faint); }

  /* "More" — the long explanation, one tap away rather than in the way.
     Everything this app knows about why a number means what it means is still
     here; it just no longer sits between you and the button. */
  details.more { margin-top: 10px; }
  details.more > summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 500; color: var(--accent); user-select: none;
  }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "ⓘ"; font-size: 13px; }
  details.more[open] > summary { margin-bottom: 4px; }
  details.more > .note, details.more > p { margin-top: 6px; }

  .promo { position: fixed; inset: 0; background: color-mix(in srgb, var(--page) 80%, transparent); display: flex; align-items: center; justify-content: center; z-index: 40; }
  .promo div { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: flex; gap: 6px; }
  .promo button { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--radius-sm); font-size: 30px; padding: 6px 12px; cursor: pointer; line-height: 1; }
  .promo button:hover { background: var(--accent-tint); }

  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: var(--ink-faint); }

  /* ── today ─────────────────────────────────────────────────────────── */
  .tasks { display: grid; gap: 10px; margin-bottom: 14px; }
  .task {
    display: grid; gap: 3px; text-align: left; width: 100%;
    border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px; cursor: pointer; color: var(--ink); transition: border-color .12s, background .12s;
  }
  .task:hover { border-color: var(--accent); }
  .task-kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .task-title { font-size: 15px; font-weight: 600; }
  .task-note { font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
  .task-go { font-size: 13px; color: var(--accent); font-weight: 500; margin-top: 4px; }

  .record { display: grid; gap: 0; }
  .record-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .record-row:last-child { border-bottom: 0; }
  .record-band { color: var(--ink-soft); }
  .record-score { font-variant-numeric: tabular-nums; font-weight: 600; }
  .record-open {
    width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    color: inherit; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; align-items: baseline;
  }
  .record-open:hover, .record-open:focus-visible { background: var(--sunk); }
  .record-open:hover .record-band, .record-open:focus-visible .record-band { color: var(--ink); }

  /* ── where the time goes ──────────────────────────────────────────── */
  .timebar { display: grid; grid-template-columns: 7.5rem 1fr 3rem 2.5rem; gap: 8px; align-items: center; padding: 3px 0; font-size: 12.5px; }
  .timebar-k { color: var(--ink-soft); }
  .timebar-track { background: var(--sunk); height: 8px; border-radius: 4px; overflow: hidden; }
  .timebar-fill { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .timebar-v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .timebar-n { font-variant-numeric: tabular-nums; color: var(--ink-faint); text-align: right; }

  /* ── forms ─────────────────────────────────────────────────────────── */
  .field { display: grid; gap: 5px; margin-bottom: 10px; }
  .field > span { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
  select, input[type="text"], textarea {
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); border-radius: var(--radius-sm);
    padding: 9px 11px; font: inherit; font-size: 14px; width: 100%;
  }
  select:focus, input[type="text"]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  textarea { resize: vertical; font-size: 13px; line-height: 1.5; }
  .fields { display: grid; gap: 10px; margin-top: 12px; }
  @media (min-width: 620px) { .fields { grid-template-columns: repeat(3, 1fr); } }
  .caution { border-left: 4px solid var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent); padding: 8px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .toggles { display: grid; gap: 8px; margin-top: 10px; }
  .toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
  .toggle input { margin: 3px 0 0; accent-color: var(--accent); flex: none; width: 16px; height: 16px; }
  .toggle small { display: block; color: var(--ink-faint); font-size: 12px; margin-top: 1px; }
  .fen { font-family: var(--mono); font-size: 11.5px; }

  /* ── openings ──────────────────────────────────────────────────────── */
  .method summary { cursor: pointer; list-style: none; }
  .method summary::-webkit-details-marker { display: none; }
  .method summary h2 { display: inline; }
  .method summary::after { content: " ▾"; color: var(--accent); font-size: 12px; }
  .method[open] summary::after { content: " ▴"; }
  .method p { max-width: 66ch; font-size: 14px; }
  .method-steps { max-width: 66ch; padding-left: 20px; font-size: 14px; }
  .method-steps li { margin-bottom: 8px; line-height: 1.55; }
  .method-steps li::marker { color: var(--accent); font-weight: 600; }

  .group { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin: 16px 0 8px; font-weight: 600; }
  .opening-grid { display: grid; gap: 10px; }
  @media (min-width: 720px) { .opening-grid { grid-template-columns: 1fr 1fr; } }
  .opening { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 6px; align-content: start; }
  .opening.due { border-color: var(--accent); }
  .opening-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .opening-name { font-weight: 600; font-size: 15px; }
  .opening-eco { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
  .opening-plan { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 0; }
  .opening-state { font-size: 12px; color: var(--ink-faint); margin: 0; }
  .idea-who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 10px 0 4px; }
  .idea { font-size: 14px; line-height: 1.6; margin: 0; }
  .prompt { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin: 10px 0 0; }

  /* ── review ────────────────────────────────────────────────────────── */
  .how { margin: 8px 0 12px; font-size: 13px; color: var(--ink-soft); }
  .how summary { cursor: pointer; font-weight: 500; color: var(--accent); }
  .how p { margin: 8px 0; max-width: 64ch; }
  .progress { height: 6px; margin-top: 10px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; border-radius: 3px; }
  .after { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }

  .mistake {
    display: grid; grid-template-columns: 6.5rem auto; gap: 2px 10px; width: 100%; text-align: left;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--ink);
    padding: 10px 0; cursor: pointer;
  }
  .mistake:hover { background: var(--sunk); }
  .mistake-move { font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; }
  .mistake-sev { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  .mistake.blunder .mistake-sev { color: var(--danger); }
  .mistake.blunder .mistake-sev::before { content: "?? "; }
  .mistake.mistake .mistake-sev { color: var(--warn); }
  .mistake.mistake .mistake-sev::before { content: "? "; }
  .mistake.inaccuracy .mistake-sev { color: var(--ink-faint); }
  .mistake.inaccuracy .mistake-sev::before { content: "?! "; }
  .mistake-note { grid-column: 2; font-size: 12.5px; color: var(--ink-soft); }
  .mistake-why { grid-column: 2; font-size: 12.5px; color: var(--ink); }

  /* ── progress ──────────────────────────────────────────────────────── */
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 5.5rem 1fr 2rem; gap: 9px; align-items: center; font-size: 12.5px; }
  .bar-label { text-transform: capitalize; color: var(--ink-soft); }
  .bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--danger); border-radius: 4px; }
  .bar-fill.sev-mistake { background: var(--warn); }
  .bar-fill.sev-inaccuracy { background: var(--ink-faint); }
  .bar-count { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ── eval bar ──────────────────────────────────────────────────────── */
  .board-with-bar { display: flex; gap: 10px; align-items: flex-start; }
  .board-with-bar > .board-host { flex: 1 1 auto; min-width: 0; }
  .evalbar {
    flex: none; width: 16px; align-self: stretch; border-radius: 5px; overflow: hidden;
    background: #2b2f36; position: relative; margin-bottom: 19px; box-shadow: 0 0 0 1px var(--line-strong);
  }
  .evalbar-white { position: absolute; left: 0; right: 0; bottom: 0; background: #f4f4f2; height: 50%; transition: height .3s ease; }
  .evalbar.flipped .evalbar-white { bottom: auto; top: 0; }
  .evalbar-label {
    position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 600;
    line-height: 1; padding: 2px 0; font-variant-numeric: tabular-nums; writing-mode: vertical-rl; transform: rotate(180deg);
  }
  .evalbar-label.top { top: 4px; color: #f4f4f2; }
  .evalbar-label.bottom { bottom: 4px; color: #2b2f36; }
  .evalbar.flipped .evalbar-label.top { color: #2b2f36; }
  .evalbar.flipped .evalbar-label.bottom { color: #f4f4f2; }

  /* ── analysis board ─────────────────────────────────────────────────── */
  .lines { display: grid; gap: 6px; font-size: 13px; }
  .line-row { display: grid; grid-template-columns: 3.6rem 1fr; gap: 8px; border: 1px solid var(--line); background: var(--sunk); border-radius: var(--radius-sm); padding: 7px 10px; text-align: left; cursor: pointer; color: var(--ink); }
  .line-row:hover { background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .line-score { font-weight: 600; font-variant-numeric: tabular-nums; }
  .line-moves { color: var(--ink-soft); overflow-wrap: anywhere; font-family: var(--mono); font-size: 12.5px; }
  .line-row.top .line-score { color: var(--good); }
  .movelist { display: flex; flex-wrap: wrap; gap: 3px; font-size: 13px; max-height: 240px; overflow-y: auto; font-family: var(--mono); }
  .movelist .mn { color: var(--ink-faint); padding: 4px 2px 4px 6px; font-variant-numeric: tabular-nums; }
  .movelist .mv { border: 1px solid transparent; border-radius: var(--radius-xs); background: transparent; padding: 3px 7px; cursor: pointer; color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
  .movelist .mv:hover { background: var(--sunk); }
  .movelist .mv.on { background: var(--accent); color: var(--on-accent); }
  .movelist .mv.mine { font-weight: 600; }
  .movelist .mv[data-class="best"]::after { content: " ★"; color: var(--good); font-size: 10px; }
  .movelist .mv[data-class="inaccuracy"]::after { content: " ?!"; color: var(--ink-faint); font-weight: 600; }
  .movelist .mv[data-class="mistake"]::after { content: " ?"; color: var(--warn); font-weight: 600; }
  .movelist .mv[data-class="blunder"]::after { content: " ??"; color: var(--danger); font-weight: 700; }
  .movelist .mv[data-class="missed_mate"]::after,
  .movelist .mv[data-class="allowed_mate"]::after { content: " #?"; color: var(--danger); font-weight: 700; }
  .movelist .mv.on::after { color: var(--on-accent); }

  /* ── opening move chips and tooltips ──────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 0; }
  .chip {
    position: relative; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); border-radius: var(--radius-xs);
    padding: 4px 9px; font: inherit; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .chip.mine { font-weight: 600; }
  .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip.todo { opacity: .45; }
  .chip .mn { color: inherit; opacity: .6; margin-right: 3px; font-size: 11px; }
  .tip {
    position: absolute; z-index: 30; max-width: min(320px, 92vw); border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; line-height: 1.5;
  }
  .tip b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .branches { display: grid; gap: 6px; margin-top: 8px; }
  .branch { display: grid; gap: 2px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); padding: 8px 10px; text-align: left; cursor: pointer; color: var(--ink); font: inherit; }
  .branch.on { background: var(--accent-tint); border-color: var(--accent); }
  .branch b { font-size: 13px; }
  .branch span { font-size: 12px; color: var(--ink-soft); }
  .branch small { font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; text-transform: uppercase; }

  /* ── clocks ─────────────────────────────────────────────────────────── */
  .clocks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; max-width: 520px; }
  .clock { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 6px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .clock .k { font-size: 12px; color: var(--ink-faint); font-weight: 500; }
  .clock b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clock.running { background: var(--accent-tint); border-color: var(--accent); }
  .clock.low b { color: var(--danger); }

  /* ── the game's curve ───────────────────────────────────────────────── */
  .curve-frame { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--radius-sm); }
  .curve { display: block; width: 100%; height: 120px; }
  .curve-fill { fill: color-mix(in srgb, var(--ink) 14%, transparent); stroke: none; }
  .curve-line { fill: none; stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .curve-mid { stroke: var(--line-strong); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 4 4; }
  .curve-dot { fill: none; stroke: var(--danger); stroke-width: 7px; stroke-linecap: round; vector-effect: non-scaling-stroke; }

  /* ── the progress chart ─────────────────────────────────────────────── */
  .chart-grid { stroke: var(--line-strong); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: .7; }
  .chart-band { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: none; }
  .chart-trend { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .chart-dot { fill: none; stroke: color-mix(in srgb, var(--ink) 40%, transparent); stroke-width: 4px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .chart-now { fill: none; stroke: var(--accent); stroke-width: 8px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .chart-plot { --plot-h: 120px; --plot-inset: 11px; display: flex; gap: 8px; align-items: stretch; }
  .chart-plot .chart-frame { flex: 1 1 auto; min-width: 0; position: relative; }
  .chart-plot .curve.chart { height: var(--plot-h); }
  .chart-yaxis { position: relative; font-size: 11px; color: var(--ink-faint); text-align: right; flex: 0 0 auto; min-width: 2.6rem; font-variant-numeric: tabular-nums; }
  .chart-yaxis span { position: absolute; right: 0; line-height: 1; transform: translateY(-50%); }
  .chart-yaxis span:nth-child(1) { top: calc(var(--plot-inset) + var(--plot-h) * 0.04); }
  .chart-yaxis span:nth-child(2) { top: calc(var(--plot-inset) + var(--plot-h) * 0.50); }
  .chart-yaxis span:nth-child(3) { top: calc(var(--plot-inset) + var(--plot-h) * 0.96); }
  .chart-tip {
    position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%);
    background: var(--ink); color: var(--page); border-radius: var(--radius-xs); box-shadow: var(--shadow);
    padding: 4px 8px; font-size: 11.5px; white-space: nowrap; pointer-events: none; z-index: 3; font-variant-numeric: tabular-nums;
  }
  /* Room for the half of an edge dot that falls outside the plot; the vertical
     half is --plot-inset less the 1px border so the labels stay on their lines. */
  .chart-frame { padding: calc(var(--plot-inset, 11px) - 1px) 9px; }
  .chart { overflow: visible; }
  .chart-scale { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--ink-faint); padding: 4px 2px 0; font-variant-numeric: tabular-nums; }
  .chart-scale span { white-space: nowrap; }
  .chart-key { margin-top: 6px; }

  /* ── the coach ──────────────────────────────────────────────────────── */
  .coach-log { max-height: 320px; overflow-y: auto; display: grid; gap: 10px; }
  .coach-you { border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 7px 10px; margin: 0; font-size: 13.5px; font-weight: 500; }
  .coach-answer { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .coach-line { border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink); border-radius: var(--radius-xs); font: inherit; font-family: var(--mono); font-size: 12.5px; font-weight: 600; padding: 1px 6px; cursor: pointer; margin: 0 1px; }
  .coach-line:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .coach-bad { text-decoration: underline wavy var(--danger); }

  /* ── puzzles ───────────────────────────────────────────────────────── */
  .puzzle-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); padding: 10px 0; cursor: pointer; font: inherit; }
  .puzzle-row:hover { background: var(--sunk); }
  .puzzle-when { font-weight: 600; font-variant-numeric: tabular-nums; }
  .puzzle-note { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-soft); }
  .puzzle-flag { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; color: var(--ink-faint); }
  .puzzle-flag.found { color: var(--good); }
  .puzzle-flag.missed { color: var(--danger); }

  /* ── settings ──────────────────────────────────────────────────────── */
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { display: grid; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); padding: 7px; cursor: pointer; color: var(--ink); font: inherit; font-size: 12px; text-align: center; }
  .swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint); }
  .swatch i { display: grid; grid-template-columns: 1fr 1fr; width: 44px; height: 44px; border-radius: 6px; overflow: hidden; margin: 0 auto; }
  .swatch i b { display: block; }
  .swatch i b:nth-child(1), .swatch i b:nth-child(4) { background: var(--sw-light); }
  .swatch i b:nth-child(2), .swatch i b:nth-child(3) { background: var(--sw-dark); }
  .style-pick { display: grid; gap: 8px; }
  @media (min-width: 620px) { .style-pick { grid-template-columns: repeat(3, 1fr); } }
  .style-card { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm); padding: 8px; cursor: pointer; color: var(--ink); font: inherit; text-align: left; display: grid; gap: 6px; }
  .style-card.on { background: var(--accent-tint); border-color: var(--accent); }
  .style-card b { font-size: 13px; font-weight: 600; }
  .style-card .mini { width: 100%; max-width: 160px; }
  .style-card .mini .board-frame { box-shadow: 0 0 0 1px var(--line-strong); }
  .install { display: grid; gap: 6px; font-size: 13px; }
  .install p { margin: 0; }
  .kbd { border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; font-size: 11.5px; font-family: var(--mono); background: var(--sunk); }
  .gear { margin-left: auto; }

  [hidden] { display: none !important; }

  /* ── the endgame list ──────────────────────────────────────────────── */
  .endgame-row { border-top: 1px solid var(--line); padding: 12px 0 14px; }
  .endgame-row:first-of-type { border-top: 0; }
  .endgame-head { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; white-space: nowrap; color: var(--ink-soft); }
  .tag.good { background: var(--good); color: #ffffff; border-color: var(--good); }

  /* ── notation ──────────────────────────────────────────────────────── */
  .san-big { font-family: var(--mono); font-size: 32px; font-weight: 600; letter-spacing: .02em; margin: 12px 0 10px; color: var(--ink); }
  .san-big.waiting { color: var(--ink-faint); }
  .san-part { display: flex; gap: 12px; align-items: baseline; border-top: 1px solid var(--line); padding: 10px 0; }
  .san-part:first-of-type { border-top: 0; }
  .san-part-text { font-family: var(--mono); font-size: 19px; font-weight: 600; min-width: 3.2em; flex: 0 0 auto; color: var(--accent); }
  .san-part-body { flex: 1 1 auto; min-width: 0; }
