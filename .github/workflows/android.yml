# Builds the Android app and attaches it to a release you can open on a phone.
#
# The APK is the trainer's own dist/pwa/index.html inside a WebView — see
# hard-lines-chess/android/README.md. It is built from source here rather than
# from the committed dist/ for the same reason the Pages workflow is: a build
# that ships whatever happens to be committed can ship an older game than the
# repo's own source.
name: Android

on:
  # EVERY BRANCH BUILDS, ONLY main PUBLISHES. The APK build is the one part of
  # this repo that no local test covers — it needs an Android SDK — so a branch
  # that breaks it should say so on the branch, not after a merge. The release
  # step below is gated on main, so a branch build produces an artifact and
  # nothing else.
  push:
    branches: ['**']
    # Nothing here changes the app, so nothing here should build one.
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The app itself. android/app/build.gradle copies the file this writes
      # into the APK's assets and fails the build if it is not there.
      - name: Build the single-file app
        working-directory: hard-lines-chess
        run: python3 build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Assemble the release APK
        working-directory: hard-lines-chess/android
        env:
          # Must increase for every build, or Android refuses to install this
          # one over the copy already on the phone. The run number only ever
          # goes up.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Find it, and check it is what it claims to be
        id: apk
        working-directory: hard-lines-chess/android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK was produced"; exit 1; }
          echo "built $APK ($(du -h "$APK" | cut -f1))"

          # THE APK MUST CONTAIN THE APP. A wrapper that builds and installs
          # and opens on a blank screen is the one failure this whole workflow
          # exists to prevent, and it is invisible from a green build — the
          # asset copy is a separate task from the compile, so the compile can
          # succeed with nothing to show.
          unzip -l "$APK" | grep -q 'assets/index.html' \
            || { echo "the APK has no assets/index.html — the app is missing from it"; exit 1; }
          for f in archivo-black-400 space-mono-400 space-mono-700; do
            unzip -l "$APK" | grep -q "assets/fonts/$f.woff2" \
              || { echo "the APK is missing assets/fonts/$f.woff2"; exit 1; }
          done

          # And it must be signed, or a phone will not install it at all.
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q 'SHA-256 digest' certs.txt || { echo "the APK is not signed"; exit 1; }

          mkdir -p ../../out
          cp "$APK" ../../out/hard-lines-chess.apk
          {
            echo "path=out/hard-lines-chess.apk"
            echo "version=$(python3 -c "import json;print(json.load(open('../package.json'))['version'])")"
            echo "sha256=$(sha256sum ../../out/hard-lines-chess.apk | cut -d' ' -f1)"
            echo "size=$(du -h ../../out/hard-lines-chess.apk | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hard-lines-chess-apk
          path: out/hard-lines-chess.apk
          if-no-files-found: error

      # ── the download link ─────────────────────────────────────────────────
      #
      # One release, replaced in place, so the address you send to a phone
      # never changes:
      #
      #   .../releases/download/android-latest/hard-lines-chess.apk
      #
      # A tag would give a new link every build, and a link that has to be
      # looked up again each time is a link that gets sent stale.
      - name: Publish it
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Hard Lines Chess — Android
          files: out/hard-lines-chess.apk
          target_commitish: ${{ github.sha }}
          body: |
            The Android app: the whole trainer — engine, 22-band ladder, 25
            openings, review, drills and puzzles — inside one APK.

            **[Download hard-lines-chess.apk](https://github.com/${{ github.repository }}/releases/download/android-latest/hard-lines-chess.apk)**

            Open that link on the phone, tap the file when it has downloaded,
            and allow your browser to install apps when Android asks. Nothing
            else is needed: there is no account, and the app has no internet
            permission at all, so it works the same on a plane as at home.

            | | |
            |---|---|
            | version | `${{ steps.apk.outputs.version }}` (build ${{ github.run_number }}) |
            | size | ${{ steps.apk.outputs.size }} |
            | sha256 | `${{ steps.apk.outputs.sha256 }}` |
            | built from | [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |

            Updates install over the top and keep your games, drills and
            settings, because every build is signed with the same key —
            `4F:71:75:E9:02:F6:C0:8F:49:C9:38:CF:24:E1:B4:98:9D:28:49:5C:AE:4B:D1:67:0E:D0:DD:98:83:90:DB:92`.
            That key is in the repository and is not a secret; see
            `hard-lines-chess/android/README.md` for what it does and does not
            protect.

            Prefer not to sideload? The same app installs from the web at
            https://${{ github.repository_owner }}.github.io/hard-lines-chess/
            — Chrome offers "Install app" and it lands on the home screen too.
