# Publishes the installable kit to GitHub Pages.
#
# A browser will only install an app from a real web address, so the kit in
# dist/pwa/ is inert until it is served from one. This puts it at
# https://<owner>.github.io/hard-lines-chess/ on every push to main.
#
# The kit is BUILT here rather than taken from the committed dist/. dist/ is
# committed so the repo is usable without building, but a build that publishes
# whatever happens to be committed is a build that can publish a stale page —
# and the service worker's version is a hash of the index.html build.py writes,
# so publishing a stale index with a fresh worker is exactly the failure the
# worker's version stamp exists to prevent.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older queued one, but a run
# already deploying is allowed to finish rather than leaving Pages half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the installable kit
        working-directory: hard-lines-chess
        run: python3 build.py

      # Fail loudly rather than deploying an empty site. upload-pages-artifact
      # is happy to publish an empty directory, and the result is a 404 that
      # looks like Pages being misconfigured.
      - name: Check the kit is complete
        working-directory: hard-lines-chess
        run: |
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            test -s "dist/pwa/$f" || { echo "dist/pwa/$f is missing or empty"; exit 1; }
          done
          grep -q 'rel="manifest"' dist/pwa/index.html || { echo 'dist/pwa/index.html does not link the manifest'; exit 1; }
          echo "kit ok — index.html is $(wc -c < dist/pwa/index.html) bytes"

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so there is no settings
          # page to visit before the first deploy.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hard-lines-chess/dist/pwa

      - id: deployment
        uses: actions/deploy-pages@v4
